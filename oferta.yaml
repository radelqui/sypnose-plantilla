# Líneas cubiertas por la solución con certeza por línea.
# observado = comprobación ejecutada con éxito y fuentes existentes
# inferido  = evidencia real pero parcial o con fuentes en fallo
# propuesto = sin evidencia
# enlazar_solucion.py usa este mapa para escribir cubre con la certeza correcta.
cubre_por_evidencia:
  T01: observado
  T02: observado
  T03: observado
  T05: observado
  T06: observado
  T07: observado     # gh:run:34983669221 success (lead autoriza subida)
  T08: inferido      # evidencia dice PARCIAL (psql manual no en CI)
  T09: observado
  T10: observado
  T12: observado
  T13: observado
  T14: observado     # gh:run:34983669221 success (lead autoriza subida)
  T04: observado     # como-estoy-hecho React UI: viewport meta + static served
  T11: observado     # como-estoy-hecho React frontend: SPA placeholder + domain router
  T15: observado
# Líneas de proceso: no tienen archivos de código; su certeza viene de evidencias evento:/git:commit:.
lineas_de_proceso: [T06, T09]
