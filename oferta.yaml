# A5.5 (16-sep): Stack como dato del registro. Cada entrada verificada contra el repo real.
# cargar_stack.py crea nodos tec:coforge:<id>, relaciones usa/cubre, afirmaciones.
# decide_banco: qué puede tener el banco en su lugar. que_cambia: ficheros que se tocan.
# generar_contrato_banco.py genera CONTRATO-BANCO.md desde esta sección.
stack:
  solucion:
    - id: python311
      nombre: Python 3.11
      grupo: lenguaje-backend
      para_que: Lenguaje del microservicio, tipado estricto, async nativo
      por_que: Requisito de la oferta (Python Developer), soporte LTS
      lineas: [T01, T03, T05]
      evidencia: [Dockerfile@FROM python:3.11-slim, .github/workflows/ci.yml@python-version]
      estado: implementado
      decide_banco: Versión de Python aprobada (3.11+ preferido por async y typing)
      que_cambia: [Dockerfile (FROM), .github/workflows/ci.yml (python-version), requirements*.txt]
      hecho_por: [IA:02-backend-api:claude-sonnet-5]
      verificado_en: [22990, 22988]
    - id: fastapi
      nombre: FastAPI + Uvicorn
      grupo: lenguaje-backend
      para_que: Framework HTTP async con OpenAPI automática
      por_que: Rendimiento async para streams SSE, validación con Pydantic integrada
      lineas: [T01, T03]
      evidencia: [requirements.txt@fastapi, requirements.txt@uvicorn, Dockerfile@CMD uvicorn]
      estado: implementado
      decide_banco: "Framework HTTP: Flask, Django REST, framework interno del banco"
      que_cambia: [requirements.txt, app/main.py (app factory), Dockerfile (CMD)]
      hecho_por: [IA:02-backend-api:claude-sonnet-5]
      verificado_en: [22988, 23418]
    - id: pydantic
      nombre: Pydantic / pydantic-settings
      grupo: lenguaje-backend
      para_que: Validación de esquemas y configuración por entorno
      por_que: Sin secretos en código; la config viene de env vars que inyecta K8s
      lineas: [T01, T10]
      evidencia: [requirements.txt@pydantic-settings]
      estado: implementado
      decide_banco: "Validación: marshmallow, attrs, o schema del framework elegido"
      que_cambia: [requirements.txt, app/core/config.py, app/api/schemas.py]
      hecho_por: [IA:02-backend-api:claude-sonnet-5]
      verificado_en: [22988, 22992]
    - id: sqlalchemy-asyncpg
      nombre: SQLAlchemy 2 async + asyncpg
      grupo: base-datos
      para_que: ORM async con pool de conexiones para PostgreSQL
      por_que: Dos URLs de conexión (app rw + ai readonly) por mínimo privilegio
      lineas: [T01, T08]
      evidencia: [requirements.txt@sqlalchemy, requirements.txt@asyncpg]
      estado: implementado
      decide_banco: "ORM/driver: psycopg2 sync, Django ORM, driver propietario del banco"
      que_cambia: [requirements.txt, app/core/db.py, docker-compose.yml (env vars)]
      hecho_por: [IA:02-backend-api:claude-sonnet-5, IA:03-datos-rag:claude-sonnet-5]
      verificado_en: [23418, 23253]
    - id: llamaindex
      nombre: LlamaIndex (core + postgres + anthropic + openai)
      grupo: ia-agentes
      para_que: RAG con retriever híbrido (vectores + texto), FunctionTool, FunctionAgent
      por_que: Abstracción de vectorstore + agente que evita SQL directo desde el LLM
      lineas: [T02, T08, T12]
      evidencia: [requirements.txt@llama-index-core, requirements.txt@llama-index-vector-stores-postgres, requirements.txt@llama-index-llms-anthropic, requirements.txt@llama-index-embeddings-openai]
      estado: implementado
      decide_banco: "Framework RAG: LangChain, Haystack, SDK directo del LLM, framework interno"
      que_cambia: [requirements.txt, app/rag/engine.py, app/agent/tools.py, scripts/ingest.py]
      hecho_por: [IA:04-agentes:claude-sonnet-5, IA:03-datos-rag:claude-sonnet-5]
      verificado_en: [23418, 23253, 23297]
    - id: anthropic-llm
      nombre: Modelo de frontera (Anthropic API)
      grupo: ia-agentes
      para_que: LLM para razonamiento del agente bancario
      por_que: API vía secreto K8s; el LLM nunca elige el cliente (identidad por cabecera)
      lineas: [T02]
      evidencia: [requirements.txt@llama-index-llms-anthropic, k8s/deployment.yaml@rag-agent-llm-secrets]
      estado: implementado
      decide_banco: "LLM provider: Amazon Bedrock, Azure OpenAI, pasarela interna, modelo on-premise"
      que_cambia: [requirements.txt (llm adapter), app/core/config.py (ANTHROPIC_API_KEY → var nueva), k8s/deployment.yaml (secretos)]
      hecho_por: [IA:04-agentes:claude-sonnet-5]
      verificado_en: [23418]
    - id: openai-embeddings
      nombre: Modelo de embeddings (OpenAI API)
      grupo: ia-agentes
      para_que: Generación de vectores 1536d para búsqueda semántica
      por_que: Índice HNSW sobre pgvector, dimensión fija declarada en init_db.sql
      lineas: [T08]
      evidencia: [requirements.txt@llama-index-embeddings-openai, scripts/init_db.sql@vector(1536)]
      estado: implementado
      decide_banco: "Embeddings provider: Azure OpenAI, Bedrock Titan, Cohere, modelo local"
      que_cambia: [requirements.txt (embeddings adapter), app/core/config.py (OPENAI_API_KEY → var nueva), scripts/init_db.sql (dimensión vector)]
      hecho_por: [IA:03-datos-rag:claude-sonnet-5]
      verificado_en: [23253]
    - id: sse-starlette
      nombre: SSE (Server-Sent Events)
      grupo: lenguaje-backend
      para_que: Streaming de tokens del agente al cliente en tiempo real
      por_que: Alternativa ligera a WebSocket; navegador reconecta automáticamente
      lineas: [T03]
      evidencia: [requirements.txt@sse-starlette]
      estado: implementado
      decide_banco: "Streaming: WebSocket, gRPC streaming, polling largo"
      que_cambia: [requirements.txt, app/api/routes.py (streaming handler)]
      hecho_por: [IA:02-backend-api:claude-sonnet-5]
      verificado_en: [22988]
    - id: postgresql16
      nombre: PostgreSQL 16 + pgvector
      grupo: base-datos
      para_que: Base de datos relacional con extensión vectorial para RAG híbrido
      por_que: Misma BD para datos de negocio y vectores; sin servicio externo de embeddings
      lineas: [T08, T01]
      evidencia: [docker-compose.yml@pgvector/pgvector:pg16, scripts/init_db.sql@CREATE EXTENSION vector]
      estado: implementado
      decide_banco: "PostgreSQL del banco con pgvector aprobado; versión y extensiones según DBA"
      que_cambia: [docker-compose.yml (imagen), scripts/init_db.sql (extensión y roles), app/core/config.py (URLs)]
      hecho_por: [IA:03-datos-rag:claude-sonnet-5, IA:02-backend-api:claude-sonnet-5]
      verificado_en: [23253, 23418]
    - id: hnsw-gin
      nombre: Índices HNSW + GIN/tsvector
      grupo: base-datos
      para_que: Búsqueda semántica (HNSW cosine) + texto exacto (GIN tsvector español)
      por_que: Retriever híbrido combina ambos índices sin servicio externo
      lineas: [T08]
      evidencia: [scripts/init_db.sql@USING hnsw, scripts/init_db.sql@USING gin]
      estado: implementado
      decide_banco: "Parámetros HNSW (m, ef_construction), idioma de tsvector, política de reindexado"
      que_cambia: [scripts/init_db.sql (parámetros de índice y configuración de idioma)]
      hecho_por: [IA:03-datos-rag:claude-sonnet-5]
      verificado_en: [23253]
    - id: docker
      nombre: Docker multi-stage slim + docker-compose
      grupo: contenedores-despliegue
      para_que: Imagen mínima non-root para producción; entorno local reproducible
      por_que: Escaneo de imagen obligatorio; sin root ni paquetes innecesarios
      lineas: [T05, T14]
      evidencia: [Dockerfile@FROM python:3.11-slim AS builder, Dockerfile@USER appuser, docker-compose.yml@build]
      estado: implementado
      decide_banco: "Registry: Harbor, ACR, ECR, GHCR; imagen base aprobada por seguridad"
      que_cambia: [Dockerfile (FROM base image), .github/workflows/ci.yml (registry login), docker-compose.yml]
      hecho_por: [IA:02-backend-api:claude-sonnet-5, IA:01-git-cicd:claude-sonnet-5]
      verificado_en: [22990, 23416]
    - id: kubernetes
      nombre: Kubernetes (Deployment + Service + HPA)
      grupo: contenedores-despliegue
      para_que: Orquestación con escalado automático, probes y secretos
      por_que: Deployment del banco; probes verifican health, HPA escala por CPU
      lineas: [T05, T14]
      evidencia: [k8s/deployment.yaml@Deployment, k8s/deployment.yaml@Service, k8s/deployment.yaml@HorizontalPodAutoscaler, k8s/deployment.yaml@startupProbe, k8s/secrets.example.yaml]
      estado: implementado
      decide_banco: "Plataforma: EKS, AKS, OpenShift, GKE; políticas de red, RBAC y Secrets→Vault"
      que_cambia: [k8s/deployment.yaml (apiVersion, securityContext, registry, secretRef→Vault), k8s/secrets.example.yaml]
      hecho_por: [IA:02-backend-api:claude-sonnet-5, IA:01-git-cicd:claude-sonnet-5]
      verificado_en: [22990, 23416]
    - id: github-actions
      nombre: GitHub Actions (CI/CD)
      grupo: cicd-calidad
      para_que: Pipeline test→build→scan→deploy con aprobación humana
      por_que: Nada llega a producción sin lint, SAST, tests 85%, escaneo de imagen, aprobación
      lineas: [T07, T14]
      evidencia: [.github/workflows/ci.yml@test, .github/workflows/ci.yml@build-and-push, .github/workflows/ci.yml@deploy]
