# Demo: rag-banking-agent + como-estoy-hecho + Postgres efímero
# Arranque: docker compose -f docker-compose.demo.yml up -d
# 0 secretos reales: USE_FAKE_ENGINE=1 y credenciales de demo.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
      POSTGRES_DB: ${POSTGRES_DB:-banco}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - demo-net

  rag-banking-agent:
    image: ${DOCKER_REGISTRY:-ghcr.io/radelqui}/rag-banking-agent:${IMAGE_TAG:-latest}
    build:
      context: ../../rag-banking-agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-banco}
      LLAMAINDEX_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-banco}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-fake-key-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-fake-key-demo}
      USE_FAKE_ENGINE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health/live')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - demo-net

  como-estoy-hecho:
    image: ${DOCKER_REGISTRY:-ghcr.io/radelqui}/como-estoy-hecho:${IMAGE_TAG:-latest}
    build:
      context: ../../como-estoy-hecho
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: "8010"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-banco}
      LLAMAINDEX_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-banco}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-fake-key-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-fake-key-demo}
      USE_FAKE_ENGINE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8010/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - demo-net

volumes:
  pgdata:

networks:
  demo-net:
    driver: bridge
